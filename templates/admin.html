<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель: Додавання товару</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_base.css') }}">
</head>
<body>
    
        <!-- Виведення флеш-повідомлень про помилки або успіх -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-messages" style="background: #ffeb3b; padding: 10px; margin-bottom: 20px;">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
            </div>
        {% endif %}
        {% endwith %}

        <h2>Додати новий товар на вітрину</h2>

        <!-- Форма з enctype для підтримки завантаження файлів -->
        <form action="{{ url_for('admin') }}" method="POST" enctype="multipart/form-data" style="max-width: 400px; display: flex; flex-direction: column; gap: 15px;">
            
            <label>Назва товару:
                <input type="text" name="name" required style="width: 100%;">
            </label>

            <label>Модель:
                <input type="text" name="model"  style="width: 100%;">
            </label>

            <label>Колір:
                <input type="text" name="color"  style="width: 100%;">
            </label>

            <label>Ціна (грн):
                <input type="number" step="0.01" name="price"  style="width: 100%;">
            </label>

            <label>Дата надходження:
                <input type="date" name="arrival_date"  style="width: 100%;">
            </label>

            <label>Зображення товару (.jpg, .png, jpeg):
                <input type="file" name="image" accept=".jpg, .jpeg, .png" style="width: 100%;">
            </label>

            <button type="submit" style="padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer;">
                Зберегти товар
            </button>
        </form>

        <p><a href="{{ url_for('index') }}">Повернутися на головну</a></p>
    
</body>
</html>
