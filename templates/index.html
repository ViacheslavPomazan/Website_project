<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верхній одяг - Чоловічий та жіночий</title>
    <link type="text/css" href="{{url_for('static', filename='css/style_base.css')}}" rel="stylesheet" />
</head>
<body>

    <header>
        <div class="container header-content">
            <!-- Логотип компанії -->
            <a href="/" class="logo">Верхній <span>Одяг</span></a>

            <!-- Навігаційне меню -->
            <nav>
                {% block mainmenu %}
                <ul class="nav-menu">
                    {% for m in menu -%}
                        <li><a href="{{m.url}}">{{m.name}}</a></li>
                    {% endfor -%}
                </ul>
                {% endblock mainmenu %}
            </nav>
        </div>
    </header>


    <section class="hero">
        <div class="hero-content">
            <h1>Верхній одяг для жінок та чоловіків</h1>
            <p>Стильні пальто, куртки та тренчі для будь-якої погоди та сезону</p>
        </div>
    </section>

</body>
</html>
